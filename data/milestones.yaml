  when: "2021 – 2023"
  title: Master of Computer Applications — topper
  home: true
  image: /static/images/mca-convocation.jpg
  image_position: 50% 30%
  image_alt: Rohit receiving his MCA certificate and medal at the convocation ceremony
  summary: Graduated as the topper of the MCA batch at Kanpur Institute of Technology, with a CGPA of 8.75 out of 10.
  intro: >-
    I completed my Master of Computer Applications at Kanpur Institute of Technology and graduated
    as the topper of the batch — receiving the certificate and medal on stage at the convocation.
  stats:
    - { value: "8.75", label: "CGPA out of 10" }
    - { value: "#1", label: "topper of the batch" }
    - { value: "2023", label: "graduated" }
  heading: What it set in motion
  points:
    - "**A foundation in the fundamentals.** Data structures, databases, operating systems and software engineering — the unglamorous basics that every system I build still leans on."
    - "**Straight into industry.** I joined W3villa Technologies in February 2023, as the degree wrapped up, and started building products for real customers."
    - "**Giving back.** Years later I returned to the same college as an alumnus to speak to students about [why AI matters for their careers](/talks/)."

- id: pune-microsoft-meetup
  kind: Community
  when: Pune Developers Community
  title: "Beyond Data Silos: Microsoft Fabric & Azure AI Foundry"
  home: true
  image: /static/images/meetup-microsoft-pune.jpg
  image_position: 50% 24%
  image_alt: Rohit at the Pune Developers Community meetup on Microsoft Fabric and Azure AI Foundry
  summary: A meetup on how enterprises go from raw data to production-ready AI by combining unified data platforms with AI services.
  intro: >-
    I attended this Pune Developers Community meetup, "Beyond Data Silos: Crafting Intelligent
    Applications with Microsoft Fabric & Azure AI Foundry" — a practical look at how modern
    enterprises are building AI-powered applications.
  heading: What stood out
  points:
    - "**Enterprise AI application development** — how unified data platforms and AI services fit together on the way from raw data to production."
    - "**AI agents and intelligent systems** — where agentic patterns genuinely help inside a company."
    - "**Data and AI integration at scale** — keeping the data layer and the AI layer honest with each other."
    - "**Real-world adoption** — how Microsoft's AI ecosystem is actually being used by teams today."
  outro: Thank you to Murari Ramuka for the practical insights, industry experience and a clear view of where enterprise AI is heading — and to the Pune tech community for the conversations.

